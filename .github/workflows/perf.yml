name: perf

on:
  schedule:
    # Nightly at 04:17 UTC, away from the top of the hour.
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  budgets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:perf
